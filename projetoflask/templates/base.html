<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade de Resenhas Geek</title>
    <style>
        /* Variáveis de Cores - Modo Escuro Geek */
        :root {
            --bg-principal: #121212;
            --bg-secundario: #2A2D34;
            --acao-neon: #9D4EDD;
            --acao-hover: #b774ea;
            --texto-claro: #E0E0E0;
            --destaque-amarelo: #FFD700;
        }

        /* Estilos Globais */
        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Principal (O Cartão Central) */
        .container {
            background-color: var(--bg-secundario);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }

        /* Títulos */
        h2, h3 {
            color: var(--acao-neon);
            text-align: center;
            margin-top: 0;
            text-shadow: 0 0 8px rgba(157, 78, 221, 0.3);
        }

        /* Links */
        a {
            color: var(--acao-neon);
            text-decoration: none;
            transition: 0.3s;
        }
        
        a:hover {
            color: var(--acao-hover);
            text-shadow: 0 0 5px var(--acao-neon);
        }

        /* Formulários e Inputs */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 0.9em;
            font-weight: bold;
            color: var(--texto-claro);
        }

        input, textarea {
            background-color: var(--bg-principal);
            border: 1px solid #444;
            color: var(--texto-claro);
            padding: 10px;
            border-radius: 6px;
            font-size: 1em;
            transition: border 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--acao-neon);
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.5);
        }

        /* Botões Estilo Neon */
        button {
            background-color: transparent;
            color: var(--acao-neon);
            border: 2px solid var(--acao-neon);
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--acao-neon);
            color: #fff;
            box-shadow: 0 0 15px var(--acao-neon);
        }

        /* Área de Recomendação */
        .recomendacao-box {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-top: 20px;
            background-color: var(--bg-principal);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--acao-neon);
        }

        .recomendacao-box img {
            max-width: 120px;
            border-radius: 5px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        hr {
            border: 0;
            height: 1px;
            background: #444;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- O conteúdo das outras páginas será injetado aqui -->
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
