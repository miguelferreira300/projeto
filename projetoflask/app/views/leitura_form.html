{% extends "base.html" %}
{% block titulo %}{{ 'Editar livro' if editando else 'Adicionar livro' }}{% endblock %}
{% block content %}
    <h3>{{ 'Editar livro da lista' if editando else 'Adicionar à lista de leitura' }}</h3>

    <form method="POST">
        <label>Título:</label>
        <input type="text" name="titulo" value="{{ dados.titulo or '' }}" maxlength="200" required autofocus>

        <label>Autor:</label>
        <input type="text" name="autor" value="{{ dados.autor or '' }}" maxlength="120" required>

        <label>Status:</label>
        <select name="status" required>
            {% for chave, texto in status.items() %}
            <option value="{{ chave }}" {{ 'selected' if dados.status == chave }}>{{ texto }}</option>
            {% endfor %}
        </select>

        <label>Prioridade:</label>
        <select name="prioridade" required>
            {% for valor, texto in prioridades.items() %}
            <option value="{{ valor }}" {{ 'selected' if dados.prioridade == valor }}>{{ texto }}</option>
            {% endfor %}
        </select>

        <label>Observação (opcional):</label>
        <textarea name="observacao" rows="3" maxlength="500">{{ dados.observacao or '' }}</textarea>

        <button type="submit">{{ 'Salvar alterações' if editando else 'Adicionar à lista' }}</button>
    </form>
    <p class="suave centro"><a href="{{ url_for('leitura.listar', pagina=pagina|default(1)) }}">Cancelar</a></p>
{% endblock %}
