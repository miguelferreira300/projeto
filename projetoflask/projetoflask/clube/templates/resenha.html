{% extends "base.html" %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #2A2D34; padding-bottom: 10px; margin-bottom: 20px;">
        <h2>Bem-vindo, <span style="color: #9D4EDD;">{{ session['usuario'] }}</span>!</h2>
        <a href="/logout" style="color: #FFD700; text-decoration: none; font-weight: bold; font-size: 0.9em;">Sair [x]</a>
    </div>

    <h3 style="margin-bottom: 15px;">Cadastrar Nova Resenha</h3>

    <form method="POST">
        <label>Título do Livro ou HQ:</label>
        <input type="text" name="titulo" placeholder="Ex: Batman: O Cavaleiro das Trevas" required>
        
        <label>Gênero (ex: ficção, fantasia, terror):</label>
        <input type="text" name="genero" placeholder="Ex: quadrinhos" required>
        
        <label>A sua Resenha:</label>
        <textarea name="resenha" rows="5" placeholder="O que achou da história, dos personagens, da arte? Deixe aqui a sua opinião..." required></textarea>
        
        <button type="submit" style="margin-top: 10px;">Salvar e Receber Indicação</button>
    </form>
{% endblock %}
