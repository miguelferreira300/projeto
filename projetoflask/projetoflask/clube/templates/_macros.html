{# Mostra a nota em estrelas. Resenhas antigas (sem nota) aparecem como "sem nota". #}
{% macro estrelas(nota) -%}
{%- if nota -%}
<span class="estrelas" role="img" aria-label="Nota {{ nota }} de 5">{% for i in range(1, 6) %}<span class="{{ 'on' if i <= nota else 'off' }}">★</span>{% endfor %}</span>
{%- else -%}
<span class="suave">sem nota</span>
{%- endif -%}
{%- endmacro %}
