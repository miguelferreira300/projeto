<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade de Resenhas Geek</title>
    <style>
        :root {
            --bg-principal: #121212;
            --bg-secundario: #2A2D34;
            --acao-neon: #9D4EDD;
            --acao-hover: #b774ea;
            --texto-claro: #E0E0E0;
            --destaque-amarelo: #FFD700;
            --erro: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: var(--bg-secundario);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 560px;
            margin: auto 0;
        }
        h2, h3 { color: var(--acao-neon); text-align: center; margin-top: 0; text-shadow: 0 0 8px rgba(157, 78, 221, 0.3); }
        a { color: var(--acao-neon); text-decoration: none; transition: 0.3s; }
        a:hover { color: var(--acao-hover); text-shadow: 0 0 5px var(--acao-neon); }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 0.9em; font-weight: bold; }
        input, textarea {
            background-color: var(--bg-principal); border: 1px solid #444; color: var(--texto-claro);
            padding: 10px; border-radius: 6px; font-size: 1em; font-family: inherit; transition: border 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--acao-neon); box-shadow: 0 0 8px rgba(157, 78, 221, 0.5); }
        button, .botao {
            background-color: transparent; color: var(--acao-neon); border: 2px solid var(--acao-neon);
            padding: 12px; font-size: 1.05em; font-weight: bold; border-radius: 6px; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px; text-align: center; display: block;
        }
        button:hover, .botao:hover { background-color: var(--acao-neon); color: #fff; box-shadow: 0 0 15px var(--acao-neon); text-shadow: none; }
        hr { border: 0; height: 1px; background: #444; margin: 25px 0; }

        /* barra do topo */
        .topo { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px;
                border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; font-size: 0.95em; }
        .topo nav { display: flex; gap: 16px; flex-wrap: wrap; }
        .topo .sair { color: var(--destaque-amarelo); font-weight: bold; }

        /* mensagens */
        .aviso { background: var(--bg-principal); border-left: 4px solid var(--destaque-amarelo); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }

        /* cartão de cada resenha: borda neon grossa + brilho, que intensifica ao passar o mouse */
        .resenha {
            background: var(--bg-principal);
            border: 2px solid var(--acao-neon);
            border-left-width: 6px;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s;
        }
        .resenha:hover { border-color: var(--acao-hover); box-shadow: 0 0 22px rgba(157, 78, 221, 0.65); transform: translateY(-2px); }
        .resenha h3 { text-align: left; margin-bottom: 6px; }
        .suave { color: #9aa0aa; font-size: 0.85em; }
        .resenha .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        .resenha p { white-space: pre-wrap; margin: 12px 0; }
        .acoes { display: flex; gap: 14px; align-items: center; border-top: 1px solid #3a3d45; padding-top: 12px; }
        .acoes form { display: inline; }
        .acoes button { margin: 0; padding: 4px 12px; font-size: 0.9em; }
        .acoes .editar { padding: 4px 12px; font-size: 0.9em; margin: 0; border: 2px solid var(--acao-neon); border-radius: 6px; }
        .perigo { color: var(--erro); border-color: var(--erro); }
        .perigo:hover { background-color: var(--erro); box-shadow: 0 0 15px var(--erro); }

        /* estrelas (exibição) */
        .estrelas { font-size: 1.2em; letter-spacing: 2px; white-space: nowrap; }
        .estrelas .on { color: var(--destaque-amarelo); text-shadow: 0 0 6px rgba(255, 215, 0, 0.5); }
        .estrelas .off { color: #555; }

        /* estrelas (escolha da nota): radios escondidos + labels ★. Sem JavaScript.
           A ordem no HTML é 5..1 e o row-reverse mostra 1..5; "~" acende as estrelas até a escolhida. */
        .estrelas-input { position: relative; display: flex; flex-direction: row-reverse; justify-content: center; gap: 6px; }
        .estrelas-input input { position: absolute; opacity: 0; width: 1px; height: 1px; padding: 0; margin: 0; border: 0; pointer-events: none; }
        .estrelas-input label { font-size: 2.3rem; line-height: 1; color: #555; cursor: pointer; font-weight: normal; transition: color 0.15s, transform 0.15s; }
        .estrelas-input label:hover { transform: scale(1.15); }
        .estrelas-input label:hover,
        .estrelas-input label:hover ~ label,
        .estrelas-input input:checked ~ label { color: var(--destaque-amarelo); text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .estrelas-input input:focus-visible + label { outline: 2px solid var(--acao-neon); border-radius: 4px; }
        .dica { text-align: center; margin: 4px 0 0; }

        /* paginação */
        .paginacao { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 22px; }
        .paginacao a { border: 2px solid var(--acao-neon); border-radius: 6px; padding: 6px 14px; font-weight: bold; }
        .paginacao a:hover { background: var(--acao-neon); color: #fff; box-shadow: 0 0 12px var(--acao-neon); text-shadow: none; }
        .paginacao .vazio { visibility: hidden; padding: 6px 14px; border: 2px solid transparent; }
        .paginacao .info { text-align: center; }

        /* recomendação */
        .recomendacao-box { display: flex; align-items: flex-start; gap: 18px; margin-top: 16px; background: var(--bg-principal);
                            padding: 14px; border-radius: 10px; border: 2px solid var(--acao-neon); border-left-width: 6px;
                            box-shadow: 0 0 12px rgba(157, 78, 221, 0.3); }
        .recomendacao-box img, .sem-capa { width: 100px; min-width: 100px; height: 150px; border-radius: 5px; box-shadow: 2px 2px 8px rgba(0,0,0,0.8); object-fit: cover; }
        .sem-capa { background: var(--bg-secundario); color: #9aa0aa; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.9em; }
        .recomendacao-box p { margin: 0 0 6px; }
        .links { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
        .links .botao { margin-top: 0; }
        @media (max-width: 480px) { .container { padding: 22px 18px; } .recomendacao-box { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        {% if session.usuario %}
        <div class="topo">
            <span>Olá, <strong>{{ session.usuario }}</strong></span>
            <nav>
                <a href="{{ url_for('resenhas') }}">Minhas resenhas</a>
                <a href="{{ url_for('nova_resenha') }}">Nova resenha</a>
                <a class="sair" href="{{ url_for('logout') }}">Sair [x]</a>
            </nav>
        </div>
        {% endif %}
        {% for mensagem in get_flashed_messages() %}
            <div class="aviso">{{ mensagem }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
