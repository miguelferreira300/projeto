{% extends "base.html" %}
{% block content %}
    <h2>Criar conta</h2>
    <form method="POST" action="{{ url_for('auth.registro') }}">
        <label>Usuário (3 a 30 caracteres):</label>
        <input type="text" name="usuario" required minlength="3" maxlength="30" autofocus value="{{ username }}">

        <label>Senha (mínimo 6 caracteres):</label>
        <input type="password" name="senha" required minlength="6">

        <button type="submit">Criar conta e entrar</button>
    </form>
    <hr>
    <p class="suave centro">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
{% endblock %}
